<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" width="520" height="360">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="520" height="360" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="520" height="32" rx="10" fill="url(#bar)"/>
  <rect y="24" width="520" height="8" fill="url(#bar)"/>
  <circle cx="16" cy="16" r="5" fill="#ff5f57"/>
  <circle cx="34" cy="16" r="5" fill="#febc2e"/>
  <circle cx="52" cy="16" r="5" fill="#28c840"/>
  <text x="70" y="21" font-family="'SF Mono','Fira Code',monospace" font-size="11" fill="#58a6ff">$ whoami --verbose</text>

  <!-- Content -->
  <g font-family="'SF Mono','Fira Code',monospace" font-size="12.5">

    <!-- role -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze"/>
      <text x="20" y="62" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="62" fill="#58a6ff">role</text>
      <text x="120" y="62" fill="#484f58">:</text>
      <text x="136" y="62" fill="#c9d1d9">Java Backend Developer</text>
    </g>

    <!-- name -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.25s" fill="freeze"/>
      <text x="20" y="92" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="92" fill="#58a6ff">name</text>
      <text x="120" y="92" fill="#484f58">:</text>
      <text x="136" y="92" fill="#c9d1d9">Himanshu Bagga</text>
    </g>

    <!-- education -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.4s" fill="freeze"/>
      <text x="20" y="122" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="122" fill="#58a6ff">education</text>
      <text x="120" y="122" fill="#484f58">:</text>
      <text x="136" y="122" fill="#c9d1d9">B.Tech CSE  •  SRM IST</text>
    </g>

    <!-- current -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.55s" fill="freeze"/>
      <text x="20" y="152" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="152" fill="#58a6ff">current</text>
      <text x="120" y="152" fill="#484f58">:</text>
      <text x="136" y="152" fill="#c9d1d9">Building Disaster Damage Assessment Portal</text>
    </g>

    <!-- experience -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
      <text x="20" y="182" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="182" fill="#58a6ff">experience</text>
      <text x="120" y="182" fill="#484f58">:</text>
      <text x="136" y="182" fill="#c9d1d9">Java Developer Intern  @  Judge India Solutions</text>
    </g>

    <!-- previous -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.85s" fill="freeze"/>
      <text x="20" y="212" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="212" fill="#58a6ff">previous</text>
      <text x="120" y="212" fill="#484f58">:</text>
      <text x="136" y="212" fill="#c9d1d9">Backend Intern  @  Sentinel Layer</text>
    </g>

    <!-- stack -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/>
      <text x="20" y="242" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="242" fill="#58a6ff">stack</text>
      <text x="120" y="242" fill="#484f58">:</text>
      <text x="136" y="242" fill="#c9d1d9">Java • Spring Boot • MySQL • Redis • Kafka</text>
    </g>

    <!-- learning -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.15s" fill="freeze"/>
      <text x="20" y="272" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="272" fill="#58a6ff">learning</text>
      <text x="120" y="272" fill="#484f58">:</text>
      <text x="136" y="272" fill="#c9d1d9">Microservices • Docker • Kubernetes • Kafka</text>
    </g>

    <!-- publication -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.3s" fill="freeze"/>
      <text x="20" y="302" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="302" fill="#58a6ff">publication</text>
      <text x="120" y="302" fill="#484f58">:</text>
      <text x="136" y="302" fill="#c9d1d9">ICICACS 2026 (Peer-Reviewed Publication)</text>
    </g>

    <!-- hackathon -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.45s" fill="freeze"/>
      <text x="20" y="332" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="40" y="332" fill="#58a6ff">hackathon</text>
      <text x="120" y="332" fill="#484f58">:</text>
      <text x="136" y="332" fill="#c9d1d9">Smart India Hackathon Participant</text>
    </g>

    <!-- cursor -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
      <text x="20" y="352" fill="#1c7ed6" font-weight="600">❯</text>
      <rect x="36" y="340" width="7" height="14" fill="#1c7ed6">
        <animate attributeName="opacity" values="1;0;1" dur="1s" begin="1.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
