      <text x="20" y="268" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="268" fill="#58a6ff">experience</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.45s" fill="freeze"/>
      <text x="36" y="288" fill="#c9d1d9">Java Developer Intern  @  Judge India Solutions</text>
    </g>

    <!-- Prompt: previous -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
      <text x="20" y="318" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="318" fill="#58a6ff">previous</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.75s" fill="freeze"/>
      <text x="36" y="338" fill="#c9d1d9">Backend Intern  @  Sentinel Layer</text>
    </g>

    <!-- Prompt: stack -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.9s" fill="freeze"/>
      <text x="20" y="368" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="368" fill="#58a6ff">stack</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.05s" fill="freeze"/>
      <text x="36" y="388" fill="#c9d1d9">Java • Spring Boot • MySQL • Redis • Kafka</text>
    </g>

    <!-- Prompt: learning -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.2s" fill="freeze"/>
      <text x="20" y="418" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="418" fill="#58a6ff">learning</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="2.35s" fill="freeze"/>
      <text x="36" y="438" fill="#c9d1d9">Microservices • Docker • Kubernetes • Kafka</text>
    </g>
  </g>

  <!-- Cursor -->
  <rect x="20" y="428" width="7" height="14" fill="#1c7ed6" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" dur="1.2s" begin="2.5s" repeatCount="indefinite"/>
  </rect>
