<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 440" width="480" height="440">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
  </defs>

  <rect width="480" height="440" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Title bar -->
  <rect width="480" height="36" rx="10" fill="url(#bar)"/>
  <rect y="28" width="480" height="8" fill="url(#bar)"/>
  <circle cx="18" cy="18" r="5" fill="#ff5f57"/>
  <circle cx="36" cy="18" r="5" fill="#febc2e"/>
  <circle cx="54" cy="18" r="5" fill="#28c840"/>
  <text x="240" y="22" font-family="'SF Mono', 'Fira Code', 'Cascadia Code', monospace" font-size="11" fill="#484f58" text-anchor="middle">himanshu — zsh — 80x24</text>

  <!-- Content area -->
  <g font-family="'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace" font-size="12.5">

    <!-- Prompt: role -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.1s" fill="freeze"/>
      <text x="20" y="68" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="68" fill="#58a6ff">role</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.25s" fill="freeze"/>
      <text x="36" y="88" fill="#c9d1d9">Java Backend Developer</text>
    </g>

    <!-- Prompt: name -->
    <g opacity="0">
