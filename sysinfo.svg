      <text x="20" y="118" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="118" fill="#58a6ff">name</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.55s" fill="freeze"/>
      <text x="36" y="138" fill="#c9d1d9">Himanshu Bagga</text>
    </g>

    <!-- Prompt: education -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.7s" fill="freeze"/>
      <text x="20" y="168" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="168" fill="#58a6ff">education</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="0.85s" fill="freeze"/>
      <text x="36" y="188" fill="#c9d1d9">B.Tech CSE  •  SRM IST</text>
    </g>

    <!-- Prompt: current -->
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.0s" fill="freeze"/>
      <text x="20" y="218" fill="#1c7ed6" font-weight="600">❯</text>
      <text x="36" y="218" fill="#58a6ff">current</text>
    </g>
    <g opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.15s" fill="freeze"/>
      <text x="36" y="238" fill="#c9d1d9">Building Disaster Damage Assessment Portal</text>
