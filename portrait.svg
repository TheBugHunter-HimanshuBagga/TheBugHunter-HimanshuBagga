<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 520" width="380" height="520">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c7ed6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1c7ed6" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="draw">
      <rect x="0" y="0" width="380" height="0">
        <animate attributeName="height" from="0" to="520" dur="2s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="380" height="520" rx="12" fill="#0d1117"/>
  <rect width="380" height="520" rx="12" fill="url(#glow)"/>

  <g clip-path="url(#draw)">
    <!-- Head outline -->
    <ellipse cx="190" cy="175" rx="85" ry="100" fill="none" stroke="#1c7ed6" stroke-width="1.8" opacity="0.9"/>

    <!-- Hair - top -->
    <path d="M 105 140 Q 110 70 140 55 Q 170 40 200 42 Q 230 44 255 60 Q 280 78 285 140"
          fill="none" stroke="#1c7ed6" stroke-width="1.8" opacity="0.85"/>

    <!-- Hair detail - left -->
    <path d="M 108 130 Q 100 100 115 80 Q 130 62 155 55"
          fill="none" stroke="#1c7ed6" stroke-width="1.2" opacity="0.5"/>

    <!-- Hair detail - right -->
    <path d="M 272 130 Q 280 100 265 80 Q 250 62 225 55"
          fill="none" stroke="#1c7ed6" stroke-width="1.2" opacity="0.5"/>

    <!-- Hair texture lines -->
    <path d="M 130 65 Q 160 50 190 48" fill="none" stroke="#1c7ed6" stroke-width="0.8" opacity="0.3"/>
    <path d="M 140 75 Q 170 58 210 56" fill="none" stroke="#1c7ed6" stroke-width="0.8" opacity="0.3"/>
    <path d="M 155 80 Q 185 65 220 64" fill="none" stroke="#1c7ed6" stroke-width="0.8" opacity="0.3"/>

    <!-- Left ear -->
    <path d="M 107 155 Q 95 155 92 170 Q 90 185 95 195 Q 100 200 107 195"
          fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.7"/>

    <!-- Right ear -->
    <path d="M 273 155 Q 285 155 288 170 Q 290 185 285 195 Q 280 200 273 195"
          fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.7"/>

    <!-- Eyebrows -->
    <path d="M 138 148 Q 155 142 175 145" fill="none" stroke="#1c7ed6" stroke-width="1.8" opacity="0.8"/>
    <path d="M 242 148 Q 225 142 205 145" fill="none" stroke="#1c7ed6" stroke-width="1.8" opacity="0.8"/>

    <!-- Left eye -->
    <ellipse cx="157" cy="168" rx="14" ry="9" fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.85"/>
    <circle cx="157" cy="168" r="4.5" fill="#1c7ed6" opacity="0.7"/>
    <circle cx="155" cy="166" r="1.5" fill="#0d1117"/>

    <!-- Right eye -->
    <ellipse cx="223" cy="168" rx="14" ry="9" fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.85"/>
    <circle cx="223" cy="168" r="4.5" fill="#1c7ed6" opacity="0.7"/>
    <circle cx="221" cy="166" r="1.5" fill="#0d1117"/>

    <!-- Nose -->
    <path d="M 190 155 L 185 200 Q 188 208 190 210 Q 192 208 195 200 Z"
          fill="none" stroke="#1c7ed6" stroke-width="1.2" opacity="0.6"/>
    <path d="M 183 205 Q 190 212 197 205" fill="none" stroke="#1c7ed6" stroke-width="1" opacity="0.5"/>

    <!-- Mouth -->
    <path d="M 165 235 Q 178 245 190 243 Q 202 245 215 235"
          fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.7"/>
    <path d="M 170 237 Q 190 250 210 237"
          fill="none" stroke="#1c7ed6" stroke-width="0.8" opacity="0.3"/>

    <!-- Jaw line -->
    <path d="M 115 210 Q 120 260 150 290 Q 170 305 190 308 Q 210 305 230 290 Q 260 260 265 210"
          fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.6"/>

    <!-- Neck -->
    <line x1="170" y1="305" x2="165" y2="360" stroke="#1c7ed6" stroke-width="1.2" opacity="0.5"/>
    <line x1="210" y1="305" x2="215" y2="360" stroke="#1c7ed6" stroke-width="1.2" opacity="0.5"/>

    <!-- Shoulders / shirt -->
    <path d="M 165 360 Q 140 365 100 380 Q 60 400 40 440 L 40 520 L 340 520 L 340 440 Q 320 400 280 380 Q 240 365 215 360"
          fill="none" stroke="#1c7ed6" stroke-width="1.5" opacity="0.6"/>

    <!-- Collar -->
    <path d="M 165 360 L 180 390 L 190 375 L 200 390 L 215 360"
          fill="none" stroke="#1c7ed6" stroke-width="1.2" opacity="0.5"/>

    <!-- Shirt detail -->
    <path d="M 190 375 L 190 420" stroke="#1c7ed6" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Subtle scan line effect -->
  <rect width="380" height="2" y="0" fill="#1c7ed6" opacity="0.05">
    <animate attributeName="y" from="0" to="520" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
