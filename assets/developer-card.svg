    <linearGradient id="topArea" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7ebc0"/>
      <stop offset="100%" stop-color="#dcc76e"/>
    </linearGradient>
  </defs>

  <!-- FIFA Card Shape - Wider for content -->
