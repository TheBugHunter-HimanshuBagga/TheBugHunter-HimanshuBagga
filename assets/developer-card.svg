    <text x="396" y="90" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="end">JAVA BACKEND</text>
    <text x="396" y="108" font-family="Arial, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" text-anchor="end">DEVELOPER</text>

